<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B5K Bank - Contact Us</title>
<link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6ff;
        }

        header {
            background: #003b7a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .contact-box {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #003b7a;
        }

        .info {
            margin: 20px 0;
            padding: 15px;
            background: #f2f6ff;
            border-radius: 10px;
        }

        .info p {
            margin: 10px 0;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 12px;
            background: #003b7a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>🏦 B5K Bank</h1>
</header>

<div class="contact-box">

    <h2>📞 Contact Us</h2>

    <div class="info">
        <p><strong>📧 Email:</strong> support@b5kbank.com</p>
        <p><strong>📱 Phone:</strong> +91 98765 43210</p>
        <p><strong>🕒 Support:</strong> 24/7 Customer Support</p>
        <p><strong>📍 Location:</strong> Hyderabad, India</p>
    </div>

    <a href="index.html" class="back">← Back to Home</a>

</div>

</body>
</html>
