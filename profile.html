<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>B5K Bank - Profile</title>
<link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 25px 15px;
        }

        .profile-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            text-align: center;
            color: #123c69;
            margin-bottom: 25px;
        }

        .profile-icon {
            text-align: center;
            font-size: 60px;
            margin-bottom: 20px;
        }

        .info {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .info:last-of-type {
            border-bottom: none;
        }

        .label {
            color: #777;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .value {
            color: #222;
            font-size: 17px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            background: #123c69;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="profile-box">

        <div class="profile-icon">
            👤
        </div>

        <h1>My Profile</h1>

        <div class="info">
            <div class="label">Full Name</div>
            <div class="value">B5K Customer</div>
        </div>

        <div class="info">
            <div class="label">Mobile Number</div>
            <div class="value">9876543210</div>
        </div>

        <div class="info">
            <div class="label">Email</div>
            <div class="value">customer@b5kbank.com</div>
        </div>

        <div class="info">
            <div class="label">Account Number</div>
            <div class="value">XXXX XXXX 4582</div>
        </div>

        <div class="info">
            <div class="label">Account Type</div>
            <div class="value">Savings Account</div>
        </div>

        <a href="dashboard.html" class="back">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
